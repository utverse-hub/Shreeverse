<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Girlfriend Day ❤️</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

    <!-- ========================= -->
    <!-- PROLOGUE -->
    <!-- ========================= -->

    <section id="prologue">

        <!-- Background -->
        <div class="background"></div>

        <!-- Dark Overlay -->
        <div class="overlay"></div>

        <!-- Light Rays -->
        <div class="light-rays"></div>

        <!-- Door -->
        <div id="door">

            <img
                src="assets/images/doors/door-left.png"
                id="doorLeft"
                alt="Left Door">

            <img
                src="assets/images/doors/door-right.png"
                id="doorRight"
                alt="Right Door">

        </div>

        <!-- Intro Content -->

        <div class="intro-container">

            <h2 id="introText"></h2>

            <div id="keyContainer">

                <img
                    src="assets/images/keys/royal-key.png"
                    id="key"
                    alt="Royal Key">

                <p>Click to Unlock</p>

            </div>

        </div>

    </section>

    <!-- ========================= -->
    <!-- MAIN WEBSITE -->
    <!-- ========================= -->

    <main id="app" style="display:none;">

        <section id="welcomeScreen">

            <div class="welcome-content">

                <h3>Happy Girlfriend Day ❤️</h3>

                <h1>Welcome, Shree</h1>

                <p>
                    Before you lies a beautiful journey made with
                    love, memories, laughter and countless emotions.
                </p>

                <button id="beginJourney">
                    Begin Your Journey
                </button>

            </div>

        </section>

    </main>

    <!-- ========================= -->
    <!-- JAVASCRIPT -->
    <!-- ========================= -->

    <script src="js/audio.js"></script>
    <script src="js/transitions.js"></script>
    <script src="js/animations.js"></script>
    <script src="js/chapters.js"></script>
    <script src="js/app.js"></script>

</body>

</html>
